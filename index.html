<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Study Log｜英文學習日誌</title>
<style>
  :root{
    --paper:#F6F4ED;
    --card:#FFFFFF;
    --ink:#26303E;
    --ink-soft:#5A6472;
    --memo-red:#B3352C;
    --rule-blue:#A8BDD3;
    --hi:#FFE9A8;
    --pencil:#8A8F98;
    --mono:'Courier New', Courier, monospace;
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:repeating-linear-gradient(0deg, rgba(0,0,0,0.012) 0 1px, transparent 1px 3px);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.75;
    padding:28px 16px 80px;
  }
  .sheet{max-width:760px;margin:0 auto;}

  /* ===== Memo header ===== */
  .memo{
    background:var(--card);
    border:1px solid #DDD8CB;
    box-shadow:0 2px 0 rgba(38,48,62,.06), 0 12px 30px rgba(38,48,62,.07);
    padding:34px 36px 28px;
    position:relative;
    margin-bottom:36px;
  }
  .memo::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--memo-red);
  }
  .memo .co{
    font-family:var(--mono);font-weight:bold;letter-spacing:.28em;font-size:12px;
    color:var(--ink-soft);text-transform:uppercase;
  }
  .memo h1{
    font-family:var(--mono);font-size:clamp(26px,5vw,40px);line-height:1.2;
    letter-spacing:.01em;margin:10px 0 6px;
  }
  .memo h1 em{font-style:normal;color:var(--memo-red);}
  .memo .sub{color:var(--ink-soft);font-size:15px;}
  .stamp{
    position:absolute;right:26px;top:26px;transform:rotate(6deg);
    font-family:var(--mono);font-weight:bold;font-size:11px;letter-spacing:.18em;
    color:var(--memo-red);border:2px solid var(--memo-red);border-radius:4px;
    padding:4px 9px;opacity:.75;
  }
  @media(max-width:560px){.stamp{display:none;}}

  /* ===== Section head ===== */
  .sec-head{
    display:flex;align-items:baseline;gap:12px;margin-bottom:16px;
    border-bottom:2px solid var(--ink);padding-bottom:8px;
  }
  .sec-head .tag{
    font-family:var(--mono);font-weight:bold;font-size:11px;letter-spacing:.2em;
    background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:2px;white-space:nowrap;
  }
  .sec-head h2{font-size:clamp(19px,3vw,24px);letter-spacing:.02em;}

  /* ===== Catalog entries (index-card style) ===== */
  .catalog{display:grid;gap:14px;}
  .entry{
    display:flex;align-items:stretch;gap:0;text-decoration:none;color:var(--ink);
    background:var(--card);
    background-image:
      linear-gradient(transparent 0 40px, var(--memo-red) 40px 41px, transparent 41px),
      repeating-linear-gradient(transparent 0 27px, rgba(168,189,211,.35) 27px 28px);
    border:1px solid #DBD6C9;border-radius:3px;
    box-shadow:0 2px 5px rgba(38,48,62,.07);
    transition:border-color .15s, box-shadow .15s, transform .15s;
    overflow:hidden;
  }
  .entry:hover{
    border-color:var(--memo-red);
    box-shadow:0 6px 16px rgba(179,53,44,.14);
    transform:translateY(-2px);
  }
  .entry .date{
    flex-shrink:0;width:96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:rgba(38,48,62,.035);border-right:1px dashed #D8D3C6;
    font-family:var(--mono);padding:16px 8px;
  }
  .entry .date b{font-size:22px;line-height:1;color:var(--memo-red);}
  .entry .date span{font-size:11px;letter-spacing:.12em;color:var(--ink-soft);}
  .entry .meta{padding:13px 18px 15px;min-width:0;}
  .entry .kind{
    font-family:var(--mono);font-size:10.5px;font-weight:bold;letter-spacing:.16em;
    color:var(--memo-red);text-transform:uppercase;
  }
  .entry h3{font-size:17px;line-height:1.45;margin:2px 0 3px;}
  .entry p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;}
  .entry .go{
    flex-shrink:0;align-self:center;margin-left:auto;padding:0 18px;
    font-family:var(--mono);font-size:18px;color:var(--pencil);
  }
  .entry:hover .go{color:var(--memo-red);}
  @media(max-width:560px){
    .entry .date{width:76px;}
    .entry .go{display:none;}
  }

  footer{
    margin-top:60px;text-align:center;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.14em;color:var(--pencil);
  }
  footer a{color:var(--pencil);}
</style>
</head>
<body>
<div class="sheet">

  <header class="memo">
    <div class="stamp">STUDY&nbsp;LOG</div>
    <div class="co">English Study Log · Pathors</div>
    <h1>英文學習<em>日誌</em></h1>
    <div class="sub">觀影講義與英文筆記，按日期累積。點下方卡片進入各篇講義。</div>
  </header>

  <div class="sec-head"><span class="tag">CATALOG</span><h2>講義目錄</h2></div>

  <div class="catalog">

    <a class="entry" href="2026-07-21-the-office-s1e2-diversity-day.html">
      <span class="date"><b>07.21</b><span>2026</span></span>
      <span class="meta">
        <span class="kind">觀影講義 · The Office</span>
        <h3>S1E2「Diversity Day」多元日</h3>
        <p>文化典故 13 張卡＋單字片語 19 張卡＋文法句型、聽力糾錯、隨堂小測</p>
      </span>
      <span class="go">→</span>
    </a>

  </div>

  <footer>KEEP CALM AND STUDY ON · <a href="https://github.com/pathorsAI/english-study-log" target="_blank">GitHub Repo</a></footer>
</div>
</body>
</html>
